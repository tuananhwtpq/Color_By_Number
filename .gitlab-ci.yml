image: cimg/android:2026.07

workflow:
  rules:
    - if: $CI_COMMIT_TAG


variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ORG_GRADLE_PROJECT_downloadJdks: "true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: ${CI_PROJECT_ID}-v2
  paths:
    - .gradle/wrapper
    - .gradle/caches/

before_script:
  - sudo chown -R circleci:circleci .
  - chmod +x ./gradlew

stages:
  - deploy_release

build_aab:
  stage: deploy_release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+(\.\d+)*$/
  script:
    - ./gradlew bundleRelease --build-cache
  artifacts:
    name: "Release-AAB-$CI_COMMIT_TAG"
    paths:
      - app/build/outputs/bundle/release/
    expire_in: 4 weeks